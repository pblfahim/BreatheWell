</head>

  <div id="bwContextStrip" class="bw-context-strip no-print"></div>

  <main id="main" class="container py-4 bw-fade-in">
    <header class="row align-items-center g-3 mb-4">
      <div class="col-lg-7">
        <h1 class="h3 fw-bold mb-1" data-i18n="heroTitle"></h1>
        <p class="small text-muted mb-0" data-i18n="heroSub"></p>
      </div>
      <div class="col-lg-5">
        <div class="bw-card p-3">
          <div class="d-flex justify-content-between align-items-center mb-1 small">
            <span data-i18n="statTotalRx"></span>: <strong id="rxStorageCount" class="tabular-nums">0</strong>
            <span><span data-i18n="statStoragePct"></span>: <strong id="rxStoragePct" class="tabular-nums">0%</strong></span>
          </div>
          <div class="progress"><div id="rxStorageBar" class="progress-bar bg-success" role="progressbar" aria-label="Vault storage usage"></div></div>
        </div>
      </div>
    </header>

    <!-- Upload & Multi-Pass OCR Toolbar -->
    <section class="bw-card p-3 p-md-4 mb-4">
      <div id="rxUploadZone" class="rx-dropzone mb-3" role="button" tabindex="0">
        <i class="bi bi-file-earmark-arrow-up fs-1 text-primary d-block mb-2"></i>
        <strong class="d-block small mb-1" data-i18n="dropTitle"></strong>
        <small class="text-muted d-block" data-i18n="dropSub"></small>
        <input type="file" id="rxFileInput" accept="image/*,application/pdf" class="d-none">
      </div>

      <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
        <select id="rxOcrLangSelect" class="form-select w-auto">
          <option value="eng">English (OCR)</option>
          <option value="eng+ben">English + Bangla</option>
          <option value="ben">Bangla</option>
        </select>
        <button type="button" id="btnRotateLeft" class="btn btn-sm btn-outline-secondary" aria-label="Rotate Left"><i class="bi bi-arrow-counterclockwise"></i></button>
        <button type="button" id="btnRotateRight" class="btn btn-sm btn-outline-secondary" aria-label="Rotate Right"><i class="bi bi-arrow-clockwise"></i></button>
        <label class="form-check form-switch small fw-semibold mb-0"><input type="checkbox" id="rxEnhanceChk" class="form-check-input" checked> High Contrast</label>
        <button type="button" id="btnRerunOcr" class="btn btn-sm btn-bw-outline" data-i18n="btnRerun"></button>
        <button type="button" class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#rxOcrModal" data-i18n="btnRawModal"></button>
        <button type="button" id="btnSampleScan" class="btn btn-sm btn-outline-secondary ms-auto" data-i18n="btnSample"></button>
      </div>

      <div id="rxProgressWrap" class="mb-2 d-none">
        <div class="progress mb-1"><div id="rxProgress" class="progress-bar progress-bar-striped progress-bar-animated bg-success" role="progressbar" aria-label="OCR progress"></div></div>
        <small id="rxOcrStatus" class="text-muted"></small>
      </div>
      <div id="rxPreviewStrip" class="rx-preview-strip"></div>
    </section>

    <!-- 4 Structured Clinical Entry Cards -->
    <div class="row g-4 mb-4">
      <div class="col-lg-6">
        <section class="bw-card p-3 p-md-4 h-100">
          <h2 class="h6 fw-bold text-primary mb-3" data-i18n="c1Title"></h2>
          <div class="row g-2">
            <div class="col-md-6"><label for="rxDoctorInput" class="form-label small fw-semibold">Doctor *</label><input type="text" id="rxDoctorInput" class="form-control"></div>
            <div class="col-md-6"><label for="rxDegreesInput" class="form-label small fw-semibold">Degrees</label><input type="text" id="rxDegreesInput" class="form-control"></div>
            <div class="col-md-4"><label for="rxBmdcInput" class="form-label small fw-semibold">BMDC Reg</label><input type="text" id="rxBmdcInput" class="form-control"></div>
            <div class="col-md-8"><label for="rxClinicInput" class="form-label small fw-semibold">Clinic / Hospital</label><input type="text" id="rxClinicInput" class="form-control"></div>
            <div class="col-12"><label for="rxPhoneInput" class="form-label small fw-semibold">Contact Phone</label><input type="tel" id="rxPhoneInput" class="form-control"></div>
          </div>
        </section>
      </div>

      <div class="col-lg-6">
        <section class="bw-card p-3 p-md-4 h-100">
          <h2 class="h6 fw-bold text-primary mb-3" data-i18n="c2Title"></h2>
          <div class="row g-2">
            <div class="col-md-6"><label for="rxPatientInput" class="form-label small fw-semibold">Patient (Active Member)</label><input type="text" id="rxPatientInput" class="form-control"></div>
            <div class="col-md-3"><label for="rxPatientAgeInput" class="form-label small fw-semibold">Age</label><input type="text" id="rxPatientAgeInput" class="form-control tabular-nums"></div>
            <div class="col-md-3"><label for="rxPatientSexSelect" class="form-label small fw-semibold">Sex</label><select id="rxPatientSexSelect" class="form-select"><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option></select></div>
            <div class="col-md-4"><label for="rxDateInput" class="form-label small fw-semibold">Rx Date</label><input type="date" id="rxDateInput" class="form-control"></div>
            <div class="col-md-4"><label for="rxRefillInput" class="form-label small fw-semibold">Refill / Follow-Up</label><input type="date" id="rxRefillInput" class="form-control"></div>
            <div class="col-md-4"><label for="rxUrgencySelect" class="form-label small fw-semibold">Urgency</label><select id="rxUrgencySelect" class="form-select"><option value="normal">Normal</option><option value="followup">Follow-Up</option><option value="urgent">Urgent</option></select></div>
          </div>
        </section>
      </div>

      <div class="col-lg-6">
        <section class="bw-card p-3 p-md-4 h-100">
          <h2 class="h6 fw-bold text-primary mb-3" data-i18n="c3Title"></h2>
          <div class="row g-2 mb-2">
            <div class="col-3"><label for="rxOeBpInput" class="form-label small fw-semibold">BP</label><input type="text" id="rxOeBpInput" class="form-control form-control-sm" placeholder="120/80"></div>
            <div class="col-3"><label for="rxOePulseInput" class="form-label small fw-semibold">Pulse</label><input type="text" id="rxOePulseInput" class="form-control form-control-sm" placeholder="72"></div>
            <div class="col-3"><label for="rxOeTempInput" class="form-label small fw-semibold">Temp</label><input type="text" id="rxOeTempInput" class="form-control form-control-sm" placeholder="98.4F"></div>
            <div class="col-3"><label for="rxOeWeightInput" class="form-label small fw-semibold">Weight</label><input type="text" id="rxOeWeightInput" class="form-control form-control-sm" placeholder="70kg"></div>
          </div>
          <div class="mb-2"><label for="rxCcInput" class="form-label small fw-semibold">Chief Complaints (C/C)</label><input type="text" id="rxCcInput" class="form-control"></div>
          <div class="mb-2"><label for="rxHoInput" class="form-label small fw-semibold">History (H/O)</label><input type="text" id="rxHoInput" class="form-control"></div>
          <div><label for="rxInvInput" class="form-label small fw-semibold">Investigations (comma separated)</label><input type="text" id="rxInvInput" class="form-control"></div>
        </section>
      </div>

      <div class="col-lg-6">
        <section class="bw-card p-3 p-md-4 h-100">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h6 fw-bold text-primary mb-0" data-i18n="c4Title"></h2>
            <button type="button" id="rxAddMedBtn" class="btn btn-sm btn-bw-outline" data-i18n="btnAddMed"></button>
          </div>
          <div class="mb-2"><label for="rxDiagnosisInput" class="form-label small fw-semibold">Diagnosis (Dx)</label><input type="text" id="rxDiagnosisInput" class="form-control"></div>
          <div class="table-responsive mb-2">
            <table class="table table-sm align-middle mb-0">
              <thead><tr><th>Form</th><th>Medicine</th><th>Schedule</th><th>Duration</th><th></th></tr></thead>
              <tbody id="rxMedsTbody"></tbody>
            </table>
          </div>
          <div><label for="rxNotesInput" class="form-label small fw-semibold">Advice &amp; Notes</label><input type="text" id="rxNotesInput" class="form-control"></div>
        </section>
      </div>
    </div>

    <div class="text-end">
      <button type="button" id="btnOpenSaveModal" class="btn btn-bw-primary px-5"><i class="bi bi-save-fill"></i> <span data-i18n="btnOpenSave"></span></button>
    </div>
  </main>

  <!-- Save Confirmation Modal -->
  <div class="modal fade" id="rxSaveModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header"><h5 class="modal-title fw-bold" data-i18n="saveModalTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
        <div class="modal-body">
          <div class="small mb-2"><strong>Doctor:</strong> <span id="modalSummaryDoc"></span> • <strong>Patient:</strong> <span id="modalSummaryPatient"></span></div>
          <label for="rxSaveFileName" class="form-label small fw-semibold">Archive Title</label>
          <input type="text" id="rxSaveFileName" class="form-control">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" data-i18n="commonCancel"></button>
          <button type="button" id="btnConfirmSave" class="btn btn-bw-primary" data-i18n="btnConfirmSave"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Raw OCR Edit & Re-Parse Modal -->
  <div class="modal fade" id="rxOcrModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header"><h5 class="modal-title fw-bold">Raw OCR Extracted Text</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
        <div class="modal-body">
          <textarea id="rxRawOcrText" class="form-control small" rows="8"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" id="btnCopyOcrText" class="btn btn-outline-secondary" data-i18n="commonCopy"></button>
          <button type="button" id="btnReparseOcr" class="btn btn-bw-primary">Parse &amp; Focus Fields</button>
        </div>
      </div>
    </div>
  </div>
