    <!-- 4 Fixed Scenario Cards -->
    <div class="row g-3 mb-4">
      <div class="col-md-6 col-xl-3"><div class="bw-demo-preset-card"><div><h2 class="h6 fw-bold">Healthy Adult (7d)</h2><p class="small text-muted">Normal 112-116 BP &amp; Fasting 88-95 mg/dL.</p></div><button type="button" class="btn btn-bw-outline w-100" data-demo-preset="healthy" data-i18n="btnSeed"></button></div></div>
      <div class="col-md-6 col-xl-3"><div class="bw-demo-preset-card"><div><h2 class="h6 fw-bold">Hypertension (14d)</h2><p class="small text-muted">Stage 1/2 Systolic 134-145 monitoring trajectory.</p></div><button type="button" class="btn btn-bw-outline w-100" data-demo-preset="htn" data-i18n="btnSeed"></button></div></div>
      <div class="col-md-6 col-xl-3"><div class="bw-demo-preset-card"><div><h2 class="h6 fw-bold">Diabetes Watch (14d)</h2><p class="small text-muted">Mixed fasting &amp; post-meal glucose excursions.</p></div><button type="button" class="btn btn-bw-outline w-100" data-demo-preset="diabetes" data-i18n="btnSeed"></button></div></div>
      <div class="col-md-6 col-xl-3"><div class="bw-demo-preset-card"><div><h2 class="h6 fw-bold text-danger">Crisis Alert Sample</h2><p class="small text-muted">194/124 mmHg + 365 mg/dL critical threshold test.</p></div><button type="button" class="btn btn-outline-danger w-100" data-demo-preset="crisis" data-i18n="btnSeed"></button></div></div>
    </div>

    <!-- Custom Parametric Generator -->
    <section class="bw-card p-3 p-md-4 mb-4">
      <form id="ddCustomForm" class="row g-3 align-items-end">
        <div class="col-md-3"><label for="customDays" class="form-label small fw-semibold">Duration Days</label><select id="customDays" class="form-select"><option value="3">3 Days</option><option value="7" selected>7 Days</option><option value="14">14 Days</option><option value="30">30 Days</option></select></div>
        <div class="col-md-3"><label for="customType" class="form-label small fw-semibold">Record Domain</label><select id="customType" class="form-select"><option value="both">BP + Glucose</option><option value="bp">BP Only</option><option value="bg">Glucose Only</option></select></div>
        <div class="col-md-3"><label for="customProfile" class="form-label small fw-semibold">Clinical Profile</label><select id="customProfile" class="form-select"><option value="balanced">Balanced Normal</option><option value="elevated">Elevated / High</option><option value="random">Varied Mixed</option></select></div>
        <div class="col-md-3 d-grid"><button type="submit" class="btn btn-bw-primary" data-i18n="btnGenerateCustom"></button></div>
      </form>
    </section>

    <section class="bw-card p-3 p-md-4">
