  <!-- ======== MAIN VITALS ANALYZER CONTENT ======== -->
  <main id="main" class="container py-4 bw-fade-in">
    <header class="mb-4">
      <h1 class="h3 fw-bold mb-1" data-i18n="heroTitle"></h1>
      <p class="small text-muted mb-0" data-i18n="heroSub"></p>
    </header>

    <div class="row g-4 mb-4">
      <!-- Blood Pressure Form & Live AHA 2017 Gauge -->
      <div class="col-lg-6">
        <section class="bw-card p-3 p-md-4 h-100">
          <div class="d-flex align-items-center justify-content-between mb-3">
            <h2 class="h5 fw-bold mb-0"><i class="bi bi-heart-pulse-fill text-danger me-1"></i> <span data-i18n="bpCardTitle"></span></h2>
            <span id="bpLiveBadge" class="bw-status-pill bw-status-normal">—</span>
          </div>

          <div class="bw-bp-spectrum" aria-hidden="true"><div id="bpLiveNeedle" class="bw-gauge-needle"></div></div>
          <div class="d-flex justify-content-between small text-muted mb-3">
            <span>&lt;120</span><span>120-129</span><span>130-139</span><span>140+</span>
          </div>

          <div id="bpCrisisBox" class="bw-crisis-box small fw-semibold text-danger mb-3 d-none" role="alert" data-i18n="crisisWarning"></div>

          <form id="bpForm">
            <div class="row g-3">
              <div class="col-6">
                <label for="bpSysInput" class="form-label small fw-semibold" data-i18n="lblSys"></label>
                <input type="number" id="bpSysInput" class="form-control tabular-nums" value="118" min="40" max="300" required>
              </div>
              <div class="col-6">
                <label for="bpDiaInput" class="form-label small fw-semibold" data-i18n="lblDia"></label>
                <input type="number" id="bpDiaInput" class="form-control tabular-nums" value="76" min="20" max="200" required>
              </div>
              <div class="col-6">
                <label for="bpPulseInput" class="form-label small fw-semibold" data-i18n="lblPulse"></label>
                <input type="number" id="bpPulseInput" class="form-control tabular-nums" value="72" min="25" max="240">
              </div>
              <div class="col-6">
                <label for="bpArmSelect" class="form-label small fw-semibold" data-i18n="lblArm"></label>
                <select id="bpArmSelect" class="form-select">
                  <option value="left" data-i18n="armLeft"></option>
                  <option value="right" data-i18n="armRight"></option>
                </select>
              </div>
              <div class="col-12">
                <label for="bpNoteInput" class="form-label small fw-semibold" data-i18n="lblNote"></label>
                <input type="text" id="bpNoteInput" class="form-control">
              </div>
            </div>
            <button type="submit" class="btn btn-bw-primary w-100 mt-3" data-i18n="btnSaveBp"></button>
          </form>
        </section>
      </div>

      <!-- Blood Glucose Form & Live ADA 2024 Gauge -->
      <div class="col-lg-6">
        <section class="bw-card p-3 p-md-4 h-100">
          <div class="d-flex align-items-center justify-content-between mb-3">
            <h2 class="h5 fw-bold mb-0"><i class="bi bi-droplet-fill text-warning me-1"></i> <span data-i18n="glCardTitle"></span></h2>
            <span id="glLiveBadge" class="bw-status-pill bw-status-normal">—</span>
          </div>

          <div class="bw-glucose-spectrum" aria-hidden="true"><div id="glLiveNeedle" class="bw-gauge-needle"></div></div>
          <div class="d-flex justify-content-between small text-muted mb-3">
            <span>&lt;70</span><span>70-99</span><span>100-125</span><span>126+</span>
          </div>

          <div id="glHypoBox" class="bw-crisis-box small fw-semibold text-danger mb-3 d-none" role="alert" data-i18n="hypoWarning"></div>

          <form id="glForm">
            <div class="mb-3">
              <div class="d-flex align-items-center justify-content-between mb-1">
                <label for="glValInput" class="form-label small fw-semibold mb-0" data-i18n="lblGlValue"></label>
                <div class="bw-segmented">
                  <button type="button" class="bw-seg-btn active" data-gl-unit="mgdl">mg/dL</button>
                  <button type="button" class="bw-seg-btn" data-gl-unit="mmol">mmol/L</button>
                </div>
              </div>
              <input type="number" step="0.1" id="glValInput" class="form-control tabular-nums" value="94" required>
              <small id="glConvHint" class="text-muted tabular-nums"></small>
            </div>

            <div class="mb-3">
              <label for="glContextSelect" class="form-label small fw-semibold" data-i18n="lblGlContext"></label>
              <select id="glContextSelect" class="form-select">
                <option value="fasting" data-i18n="ctxFasting"></option>
                <option value="postmeal" data-i18n="ctxPostmeal"></option>
                <option value="random" data-i18n="ctxRandom"></option>
              </select>
            </div>

            <div class="mb-3">
              <label for="glNoteInput" class="form-label small fw-semibold" data-i18n="lblNote"></label>
              <input type="text" id="glNoteInput" class="form-control">
            </div>

            <button type="submit" class="btn btn-bw-primary w-100" data-i18n="btnSaveGl"></button>
          </form>
        </section>
      </div>
    </div>

    <!-- Active Member Recent Logs & Clinical WhatsApp Share -->
    <section class="bw-card p-3 p-md-4">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
        <h2 class="h5 fw-bold mb-0" data-i18n="recentTitle"></h2>
