  <main id="main" class="container py-4 bw-fade-in">
    <div class="bw-auth-card bw-reg-card mx-auto">
      <div class="text-center mb-4">
        <h1 class="h3 fw-bold mb-1" data-i18n="regHeading"></h1>
        <p class="small text-muted mb-0" data-i18n="regSubtitle"></p>
      </div>

      <div id="regErrorAlert" class="alert alert-danger small d-none" role="alert"></div>

      <form id="registerForm" novalidate>
        <!-- Step 1: Primary Member Info -->
        <div class="mb-4">
          <h2 class="h6 fw-bold mb-3 d-flex align-items-center gap-2"><span class="bw-step-badge">1</span> <span data-i18n="step1Title"></span></h2>
          <div class="row g-3">
            <div class="col-md-4"><label for="regName" class="form-label small fw-semibold" data-i18n="lblFullName"></label><input type="text" id="regName" class="form-control" data-i18n-placeholder="phFullName" required></div>
            <div class="col-md-4"><label for="regEmail" class="form-label small fw-semibold" data-i18n="lblEmail"></label><input type="email" id="regEmail" class="form-control" placeholder="name@example.com" required></div>
            <div class="col-md-4"><label for="regPhone" class="form-label small fw-semibold" data-i18n="lblPhone"></label><input type="tel" id="regPhone" class="form-control" placeholder="+8801XXXXXXXXX"></div>
            <div class="col-md-4"><label for="regAge" class="form-label small fw-semibold" data-i18n="lblAge"></label><input type="number" id="regAge" class="form-control tabular-nums" value="32" min="1" max="120"></div>
            <div class="col-md-4">
              <label for="regGender" class="form-label small fw-semibold" data-i18n="lblGender"></label>
              <select id="regGender" class="form-select"><option value="male" data-i18n="optMale"></option><option value="female" data-i18n="optFemale"></option><option value="other" data-i18n="optOther"></option></select>
            </div>
            <div class="col-md-4">
              <label for="regBloodGroup" class="form-label small fw-semibold" data-i18n="lblBloodGroup"></label>
              <select id="regBloodGroup" class="form-select"><option value="O+">O+</option><option value="O-">O-</option><option value="A+">A+</option><option value="A-">A-</option><option value="B+">B+</option><option value="B-">B-</option><option value="AB+">AB+</option><option value="AB-">AB-</option></select>
            </div>
          </div>
        </div>

        <!-- Step 2: Account Security -->
        <div class="mb-4 pt-3 border-top">
          <h2 class="h6 fw-bold mb-3 d-flex align-items-center gap-2"><span class="bw-step-badge">2</span> <span data-i18n="step2Title"></span></h2>
          <div class="row g-3">
            <div class="col-md-6">
              <label for="regPassword" class="form-label small fw-semibold" data-i18n="lblPassword"></label>
              <div class="bw-pass-wrap">
                <input type="password" id="regPassword" class="form-control" autocomplete="new-password" minlength="6" required>
                <button type="button" class="bw-pass-toggle" id="regPassToggle" aria-label="Toggle password visibility"><i class="bi bi-eye"></i></button>
              </div>
              <div class="bw-strength-bars" aria-hidden="true">
                <div id="regBar1" class="bw-sbar"></div><div id="regBar2" class="bw-sbar"></div>
                <div id="regBar3" class="bw-sbar"></div><div id="regBar4" class="bw-sbar"></div>
              </div>
            </div>
            <div class="col-md-6">
              <label for="regConfirmPassword" class="form-label small fw-semibold" data-i18n="lblConfirmPass"></label>
              <input type="password" id="regConfirmPassword" class="form-control" autocomplete="new-password" minlength="6" required>
            </div>
          </div>
        </div>

        <!-- Step 3: Primary Wellness Goal -->
        <div class="mb-4 pt-3 border-top">
          <h2 class="h6 fw-bold mb-3 d-flex align-items-center gap-2"><span class="bw-step-badge">3</span> <span data-i18n="step3Title"></span></h2>
          <div class="row g-2">
            <div class="col-sm-6 col-lg-3"><button type="button" class="bw-goal-tile active" data-reg-goal="stress"><i class="bi bi-heart me-1"></i> <span data-i18n="goalStress"></span></button></div>
            <div class="col-sm-6 col-lg-3"><button type="button" class="bw-goal-tile" data-reg-goal="focus"><i class="bi bi-bullseye me-1"></i> <span data-i18n="goalFocus"></span></button></div>
            <div class="col-sm-6 col-lg-3"><button type="button" class="bw-goal-tile" data-reg-goal="sleep"><i class="bi bi-moon-stars me-1"></i> <span data-i18n="goalSleep"></span></button></div>
            <div class="col-sm-6 col-lg-3"><button type="button" class="bw-goal-tile" data-reg-goal="mindful"><i class="bi bi-lungs me-1"></i> <span data-i18n="goalMindful"></span></button></div>
          </div>
        </div>

        <!-- Step 4: Optional Family Members Queue -->
        <div class="mb-4 pt-3 border-top">
          <h2 class="h6 fw-bold mb-3 d-flex align-items-center gap-2"><span class="bw-step-badge">4</span> <span data-i18n="step4Title"></span></h2>
          <div class="row g-2 align-items-end mb-3">
            <div class="col-md-4"><label for="regMemName" class="form-label small fw-semibold" data-i18n="lblMemName"></label><input type="text" id="regMemName" class="form-control"></div>
            <div class="col-md-3"><label for="regMemRelation" class="form-label small fw-semibold" data-i18n="lblMemRel"></label><select id="regMemRelation" class="form-select"></select></div>
            <div class="col-md-2"><label for="regMemAge" class="form-label small fw-semibold" data-i18n="lblMemAge"></label><input type="number" id="regMemAge" class="form-control tabular-nums" min="0" max="120"></div>
            <div class="col-md-3 d-grid"><button type="button" id="regAddMemberBtn" class="btn btn-bw-outline" data-i18n="btnAddFamily"></button></div>
          </div>
          <div id="regFamilyList"></div>
        </div>

        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
          <label class="form-check small"><input type="checkbox" id="regTermsChk" class="form-check-input" checked> <span data-i18n="lblTerms"></span></label>
          <button type="button" class="btn btn-link btn-sm p-0" data-bs-toggle="modal" data-bs-target="#termsModal" data-i18n="btnViewTerms"></button>
        </div>

        <button type="submit" class="btn btn-bw-primary w-100" data-i18n="btnCreateAccount"></button>
      </form>

      <div class="text-center small mt-3">
        <span class="text-muted" data-i18n="haveAccountText"></span>
        <a href="login.html" class="fw-bold text-decoration-none ms-1" data-i18n="linkLogin"></a>
      </div>
    </div>
  </main>

      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header"><h5 class="modal-title fw-bold">BreatheWell v3 Local Privacy Terms</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
        <div class="modal-body small text-muted">
          All member records, vitals, breath assessments, and digital prescriptions remain strictly inside your browser's local storage. No external servers receive any patient data. For clinical emergencies always contact 999 or your physician.
