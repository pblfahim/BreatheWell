  <!-- ======== MAIN FAMILY & MEMBER HUB ======== -->
  <main id="main" class="container py-4 bw-fade-in">
    <!-- Guest Gate View -->
    <section id="profileGuestView" class="bw-card p-4 p-lg-5 text-center mx-auto my-4">
      <div class="bw-stat-icon bw-stat-icon-teal mx-auto mb-3"><i class="bi bi-people-fill fs-3"></i></div>
      <h1 class="h3 fw-bold mb-2" data-i18n="guestHeroTitle"></h1>
      <p class="text-muted mx-auto mb-4" data-i18n="guestHeroDesc"></p>
      <div class="d-flex flex-wrap justify-content-center gap-2">
        <button type="button" id="guestDemoBtn" class="btn btn-bw-primary px-4"><i class="bi bi-stars"></i> <span data-i18n="btnDemoFamily"></span></button>
        <a href="login.html" class="btn btn-bw-outline px-4" data-i18n="btnSignIn"></a>
        <a href="register.html" class="btn btn-outline-secondary px-4" data-i18n="btnRegister"></a>
      </div>
    </section>

    <!-- Authenticated Multi-Member Management View -->
    <div id="profileAuthView" class="d-none">
      <!-- Active Member Profile Hero Banner -->
      <section class="bw-profile-hero mb-4">
        <div class="row align-items-center g-3">
          <div class="col-lg-8 d-flex align-items-center gap-3">
            <span id="activeMemberAvatar" class="bw-avatar-circle bw-avatar-lg">FM</span>
            <div>
              <div class="d-flex flex-wrap align-items-center gap-2 mb-1">
                <h1 class="h3 fw-bold mb-0" id="activeMemberName">—</h1>
                <span class="bw-profile-chip" id="activeMemberRelation">—</span>
                <span class="bw-profile-chip" id="activeMemberBlood">O+</span>
                <span class="bw-profile-chip" id="activeMemberAge">—</span>
              </div>
              <p class="mb-1 small opacity-90"><strong data-i18n="fldConditions"></strong>: <span id="activeMemberConditions">—</span></p>
              <p class="mb-0 small opacity-90"><strong data-i18n="fldAllergies"></strong>: <span id="activeMemberAllergies">—</span></p>
            </div>
          </div>
          <div class="col-lg-4 d-flex flex-wrap justify-content-lg-end gap-2">
            <button type="button" id="btnEditActiveMember" class="btn btn-light fw-semibold"><i class="bi bi-pencil-square"></i> <span data-i18n="btnEditActive"></span></button>
            <button type="button" id="btnOpenAddMember" class="btn btn-warning fw-bold"><i class="bi bi-person-plus-fill"></i> <span data-i18n="btnAddMember"></span></button>
          </div>
        </div>
      </section>

      <!-- Active Member Cross-Module Telemetry Summary -->
      <section class="row g-3 mb-4" aria-label="Active Member Clinical KPIs">
        <div class="col-6 col-lg-3">
          <div class="bw-stat-card">
            <div class="d-flex align-items-center gap-2 mb-1"><span class="bw-stat-icon bw-stat-icon-teal"><i class="bi bi-wind"></i></span><span class="small text-muted fw-semibold" data-i18n="kpiSessions"></span></div>
            <div class="h5 fw-bold mb-0 tabular-nums" id="kpiSessionsVal">—</div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="bw-stat-card">
            <div class="d-flex align-items-center gap-2 mb-1"><span class="bw-stat-icon bw-stat-icon-blue"><i class="bi bi-stopwatch"></i></span><span class="small text-muted fw-semibold" data-i18n="kpiBolt"></span></div>
            <div class="h5 fw-bold mb-0 tabular-nums" id="kpiBoltVal">—</div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="bw-stat-card">
            <div class="d-flex align-items-center gap-2 mb-1"><span class="bw-stat-icon bw-stat-icon-red"><i class="bi bi-heart-pulse"></i></span><span class="small text-muted fw-semibold" data-i18n="kpiBp"></span></div>
            <div class="h5 fw-bold mb-0 tabular-nums" id="kpiBpVal">—</div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="bw-stat-card">
            <div class="d-flex align-items-center gap-2 mb-1"><span class="bw-stat-icon bw-stat-icon-amber"><i class="bi bi-droplet-half"></i></span><span class="small text-muted fw-semibold" data-i18n="kpiGlucose"></span></div>
            <div class="h5 fw-bold mb-0 tabular-nums" id="kpiGlucoseVal">—</div>
            <small class="text-muted"><span data-i18n="kpiRx"></span>: <strong id="kpiRxVal">0</strong></small>
          </div>
        </div>
      </section>

      <!-- Family Member Directory Grid -->
      <section class="mb-5">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
          <div>
            <h2 class="h4 fw-bold mb-1" data-i18n="secRosterTitle"></h2>
            <p class="small text-muted mb-0" data-i18n="secRosterSub"></p>
          </div>
        </div>
        <div class="row g-3" id="familyRosterGrid"></div>
      </section>

      <!-- Security PIN & Full Household JSON Backup Controls -->
      <section class="row g-4">
        <div class="col-lg-6">
          <div class="bw-card p-4 h-100">
            <div class="d-flex align-items-center justify-content-between gap-2 mb-2">
              <h3 class="h5 fw-bold mb-0"><i class="bi bi-key-fill text-primary me-1"></i> <span data-i18n="lblPinTitle"></span></h3>
              <span id="pinStatusBadge" class="bw-status-pill bw-status-info">—</span>
            </div>
            <p class="small text-muted mb-3" data-i18n="lblPinDesc"></p>
            <div class="d-flex flex-wrap gap-2">
              <input type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*" id="profilePinInput" class="form-control flex-grow-1 tabular-nums" data-i18n-placeholder="pinPlaceholder">
              <button type="button" id="btnSavePin" class="btn btn-bw-primary" data-i18n="btnSavePin"></button>
              <button type="button" id="btnRemovePin" class="btn btn-outline-danger d-none" data-i18n="btnRemovePin"></button>
            </div>
          </div>
        </div>

        <div class="col-lg-6">
          <div class="bw-card p-4 h-100">
            <h3 class="h5 fw-bold mb-2"><i class="bi bi-cloud-arrow-down-fill text-success me-1"></i> <span data-i18n="lblBackupTitle"></span></h3>
            <p class="small text-muted mb-3" data-i18n="lblBackupDesc"></p>
            <div class="d-flex flex-wrap gap-2 mb-3">
              <button type="button" id="btnExportAllJson" class="btn btn-bw-outline"><i class="bi bi-download"></i> <span data-i18n="btnExportAll"></span></button>
              <label for="importBackupInput" class="btn btn-outline-primary mb-0"><i class="bi bi-upload"></i> <span data-i18n="btnImportAll"></span></label>
              <input type="file" id="importBackupInput" accept="application/json" class="d-none">
            </div>
            <div class="bw-danger-zone d-flex flex-wrap align-items-center justify-content-between gap-2">
              <div>
                <strong class="small text-danger d-block" data-i18n="lblResetMemberTitle"></strong>
                <span class="small text-muted" data-i18n="lblResetMemberDesc"></span>
              </div>
              <button type="button" id="btnResetActiveMember" class="btn btn-sm btn-outline-danger" data-i18n="btnResetMember"></button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- ======== ADD / EDIT FAMILY MEMBER MODAL ======== -->
  <div class="modal fade" id="memberFormModal" tabindex="-1" aria-labelledby="memberModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="memberModalTitle" data-i18n="modalAddTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="memberForm">
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="memName" class="form-label small fw-semibold" data-i18n="fldName"></label>
                <input type="text" id="memName" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label for="memRelation" class="form-label small fw-semibold" data-i18n="fldRelation"></label>
                <select id="memRelation" class="form-select">
                  <option value="self" data-i18n="rel_self"></option>
                  <option value="father" data-i18n="rel_father"></option>
                  <option value="mother" data-i18n="rel_mother"></option>
                  <option value="spouse" data-i18n="rel_spouse"></option>
                  <option value="child" data-i18n="rel_child"></option>
                  <option value="sibling" data-i18n="rel_sibling"></option>
                  <option value="other" data-i18n="rel_other"></option>
                </select>
              </div>
              <div class="col-md-4">
                <label for="memAge" class="form-label small fw-semibold" data-i18n="fldAge"></label>
                <input type="number" id="memAge" class="form-control tabular-nums" min="0" max="125">
              </div>
              <div class="col-md-4">
                <label for="memGender" class="form-label small fw-semibold" data-i18n="fldGender"></label>
                <select id="memGender" class="form-select">
                  <option value="male" data-i18n="genderMale"></option>
                  <option value="female" data-i18n="genderFemale"></option>
                  <option value="other" data-i18n="genderOther"></option>
                </select>
              </div>
              <div class="col-md-4">
                <label for="memBloodGroup" class="form-label small fw-semibold" data-i18n="fldBlood"></label>
                <select id="memBloodGroup" class="form-select">
                  <option value="O+">O+</option><option value="O-">O-</option>
                  <option value="A+">A+</option><option value="A-">A-</option>
                  <option value="B+">B+</option><option value="B-">B-</option>
                  <option value="AB+">AB+</option><option value="AB-">AB-</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="memPhone" class="form-label small fw-semibold" data-i18n="fldPhone"></label>
                <input type="tel" id="memPhone" class="form-control">
              </div>
              <div class="col-md-6">
                <label for="memAllergies" class="form-label small fw-semibold" data-i18n="fldAllergies"></label>
                <input type="text" id="memAllergies" class="form-control">
              </div>
              <div class="col-12">
                <label for="memConditions" class="form-label small fw-semibold" data-i18n="fldConditions"></label>
                <input type="text" id="memConditions" class="form-control">
              </div>
              <div class="col-12">
                <label for="memNotes" class="form-label small fw-semibold" data-i18n="fldNotes"></label>
                <textarea id="memNotes" class="form-control" rows="2"></textarea>
              </div>
              <div class="col-12" id="memSwitchWrap">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="memSwitchAfterAdd" checked>
                  <label class="form-check-label small fw-semibold" for="memSwitchAfterAdd" data-i18n="chkSwitchImmediately"></label>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" data-i18n="commonCancel"></button>
            <button type="submit" class="btn btn-bw-primary" data-i18n="btnModalSave"></button>
          </div>
        </form>
      </div>
    </div>
  </div>
