  <!-- ======== REGISTRATION CARD ======== -->
  <main id="main" class="bw-auth-shell">
    <div class="bw-auth-card bw-auth-card-wide bw-fade-in">
      <div class="text-center mb-4">
        <div class="bw-auth-emblem mx-auto mb-3"><i class="bi bi-person-plus-fill" aria-hidden="true"></i></div>
        <h1 class="h4 fw-bold mb-1" data-i18n="regHeading"></h1>
        <p class="small text-muted mb-0" data-i18n="regSubtitle"></p>
      </div>

      <div id="regErrorAlert" class="alert alert-danger small d-none" role="alert"></div>

      <form id="registerForm" novalidate>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="regName" class="form-label fw-semibold small" data-i18n="lblFullName"></label>
            <input type="text" id="regName" class="form-control" data-i18n-placeholder="phFullName" required>
          </div>
          <div class="col-md-6">
            <label for="regEmail" class="form-label fw-semibold small" data-i18n="lblEmail"></label>
            <input type="email" id="regEmail" class="form-control" autocomplete="email" data-i18n-placeholder="phEmail" required>
          </div>

          <div class="col-md-4">
            <label for="regAge" class="form-label fw-semibold small" data-i18n="lblAge"></label>
            <input type="number" id="regAge" class="form-control tabular-nums" min="1" max="120" value="32">
          </div>
          <div class="col-md-4">
            <label for="regGender" class="form-label fw-semibold small" data-i18n="lblGender"></label>
            <select id="regGender" class="form-select">
              <option value="male" data-i18n="optMale"></option>
              <option value="female" data-i18n="optFemale"></option>
              <option value="other" data-i18n="optOther"></option>
            </select>
          </div>
          <div class="col-md-4">
            <label for="regBloodGroup" class="form-label fw-semibold small" data-i18n="lblBloodGroup"></label>
            <select id="regBloodGroup" class="form-select">
              <option value="O+">O+</option><option value="O-">O-</option>
              <option value="A+">A+</option><option value="A-">A-</option>
              <option value="B+">B+</option><option value="B-">B-</option>
              <option value="AB+">AB+</option><option value="AB-">AB-</option>
            </select>
          </div>

          <div class="col-12">
            <label for="regPhone" class="form-label fw-semibold small" data-i18n="lblPhone"></label>
            <input type="tel" id="regPhone" class="form-control" placeholder="+8801XXXXXXXXX">
          </div>

          <div class="col-md-6">
            <label for="regPassword" class="form-label fw-semibold small" data-i18n="lblPassword"></label>
            <div class="bw-pass-wrap">
              <input type="password" id="regPassword" class="form-control" autocomplete="new-password" minlength="6" required>
              <button type="button" class="bw-pass-toggle" id="regPassToggle" aria-label="Toggle password visibility">
                <i class="bi bi-eye" aria-hidden="true"></i>
              </button>
            </div>
            <div class="bw-strength-track"><div id="regStrengthFill" class="bw-strength-fill"></div></div>
            <div id="regStrengthText" class="small text-muted mt-1"></div>
          </div>

          <div class="col-md-6">
            <label for="regConfirmPassword" class="form-label fw-semibold small" data-i18n="lblConfirmPass"></label>
            <input type="password" id="regConfirmPassword" class="form-control" autocomplete="new-password" minlength="6" required>
          </div>
        </div>

        <button type="submit" class="btn btn-bw-primary w-100 mt-4" data-i18n="btnCreateAccount"></button>
      </form>

      <div class="text-center small mt-3">
        <span class="text-muted" data-i18n="haveAccountText"></span>
        <a href="login.html" class="fw-bold text-decoration-none ms-1" data-i18n="linkLogin"></a>
      </div>
    </div>
