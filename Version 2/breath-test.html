  <main id="main" class="container py-4 bw-fade-in">
    <header class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
      <div>
        <h1 class="h3 fw-bold mb-1" data-i18n="heroTitle"></h1>
        <p class="small text-muted mb-0" data-i18n="heroSub"></p>
      </div>
      <button type="button" id="btOpenSafetyBtn" class="btn btn-bw-outline">
        <i class="bi bi-lightbulb-fill text-warning"></i> <span data-i18n="btnScienceModal"></span>
      </button>
    </header>

    <div class="row g-4 mb-5">
      <!-- BOLT Stopwatch Lab -->
      <div class="col-lg-6">
        <section class="bw-test-stage h-100 d-flex flex-column justify-content-between">
          <div>
            <h2 class="h5 fw-bold mb-2"><i class="bi bi-stopwatch text-teal"></i> <span data-i18n="tabBolt"></span></h2>
            <p class="small text-muted mb-4" data-i18n="boltStepGuide"></p>

            <div class="bw-bolt-ring-box mb-3">
              <svg class="bw-bolt-ring-svg" viewBox="0 0 220 220" aria-hidden="true">
                <circle cx="110" cy="110" r="96" fill="none" stroke="#e2e8f0" stroke-width="10"></circle>
                <circle id="boltProgressRing" cx="110" cy="110" r="96" fill="none" stroke="#00897b" stroke-width="10" stroke-linecap="round"></circle>
              </svg>
              <div class="bw-bolt-readout">
                <div id="boltReadout" class="display-5 fw-bold tabular-nums">0.0s</div>
                <span class="small text-muted">BOLT</span>
              </div>
            </div>

            <div class="text-center mb-3">
              <span id="boltTierBadge" class="bw-status-pill bw-status-info">—</span>
            </div>

            <div class="bw-spectrum-wrap" aria-hidden="true">
              <div id="boltNeedle" class="bw-spectrum-needle"></div>
            </div>
            <div class="d-flex justify-content-between small text-muted mb-3">
              <span>0s</span><span>10s</span><span>20s</span><span>30s+</span>
            </div>
          </div>

          <div>
            <input type="text" id="btNoteInput" class="form-control mb-3" placeholder="Morning quiet rest / note...">
            <div class="d-flex flex-wrap justify-content-center gap-2">
              <button type="button" id="boltToggleBtn" class="btn btn-bw-primary px-4"><i class="bi bi-play-fill"></i> <span data-i18n="btnBoltStart"></span></button>
              <button type="button" id="boltSaveBtn" class="btn btn-success px-3" disabled data-i18n="btnBoltSave"></button>
              <button type="button" id="boltResetBtn" class="btn btn-outline-secondary px-3" data-i18n="btnBoltReset"></button>
            </div>
          </div>
        </section>
      </div>

      <!-- BPM Tap Rate Lab -->
      <div class="col-lg-6">
        <section class="bw-test-stage h-100 d-flex flex-column justify-content-between text-center">
          <div>
            <h2 class="h5 fw-bold mb-2"><i class="bi bi-activity text-primary"></i> <span data-i18n="tabBpm"></span></h2>
            <p class="small text-muted mb-3" data-i18n="bpmGuide"></p>

            <div class="bw-segmented mb-4">
              <button type="button" class="bw-seg-btn active" data-bpm-win="30">30s</button>
              <button type="button" class="bw-seg-btn" data-bpm-win="60">60s</button>
            </div>

            <div class="mb-3">
              <button type="button" id="bpmTapBtn" class="bw-bpm-tap-btn">
                <i class="bi bi-hand-index-thumb fs-2 mb-1"></i>
                <span data-i18n="bpmTapLabel"></span>
                <span id="bpmCountDisplay" class="fs-3 fw-bold tabular-nums mt-1">0</span>
              </button>
            </div>

            <div class="d-flex justify-content-center gap-4 mb-3">
              <div><small class="text-muted d-block">Remaining</small><strong id="bpmRemDisplay" class="fs-4 tabular-nums">30s</strong></div>
              <div><small class="text-muted d-block">Rate</small><strong id="bpmResultDisplay" class="fs-4 tabular-nums">— BPM</strong></div>
            </div>
          </div>

          <div class="d-flex justify-content-center flex-wrap gap-2">
            <button type="button" id="bpmStartBtn" class="btn btn-bw-outline px-4" data-i18n="bpmStartTimer"></button>
            <button type="button" id="bpmSaveBtn" class="btn btn-success px-4" disabled data-i18n="bpmSaveScore"></button>
          </div>
        </section>
      </div>
    </div>

    <!-- Trend Chart & Saved History Table -->
    <div class="row g-4">
      <div class="col-lg-6">
        <div class="bw-card p-3 p-md-4 h-100">
          <h2 class="h5 fw-bold mb-3" data-i18n="chartTitle"></h2>
          <div id="btChartContainer"></div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="bw-card p-3 p-md-4 h-100">
          <div class="d-flex align-items-center justify-content-between mb-3">
            <h2 class="h5 fw-bold mb-0" data-i18n="historyTitle"></h2>
            <button type="button" id="btExportCsvBtn" class="btn btn-sm btn-bw-outline"><i class="bi bi-filetype-csv"></i> CSV</button>
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead><tr><th>Date</th><th>BOLT</th><th>BPM</th><th>Note</th><th></th></tr></thead>
              <tbody id="btHistoryBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- ======== SCIENCE INSIGHT, BOHR EFFECT SVG & INTERACTIVE FAQ MODAL ======== -->
  <div class="modal fade" id="btScienceModal" tabindex="-1" aria-labelledby="btScienceLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="btScienceLabel" data-i18n="scienceModalTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <h6 class="fw-bold text-primary" data-i18n="scienceBohrTitle"></h6>
          <p class="small text-muted" data-i18n="scienceBohrDesc"></p>

          <!-- Clean Clinical Bohr Dissociation Curve Diagram -->
          <div class="bg-light rounded-3 p-3 border mb-3 text-center">
            <svg viewBox="0 0 460 150" class="w-100 h-auto" role="img" aria-label="Bohr Effect Hemoglobin O2 Release Curve">
              <line x1="40" y1="125" x2="430" y2="125" stroke="#94a3b8" stroke-width="1.5" />
              <line x1="40" y1="15" x2="40" y2="125" stroke="#94a3b8" stroke-width="1.5" />
              <path d="M 40 124 Q 130 112 210 55 T 410 22" fill="none" stroke="#1769aa" stroke-width="3" />
              <path d="M 40 124 Q 170 118 265 72 T 410 34" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="6 4" />
              <text x="190" y="42" font-size="11" fill="#1769aa">Low CO2 (O2 locked to Hb)</text>
              <text x="245" y="95" font-size="11" fill="#047857">Optimal CO2 (Bohr Right Shift: O2 Released)</text>
              <text x="235" y="142" font-size="11" fill="#475569">Partial Pressure of O2 (mmHg)</text>
            </svg>
          </div>

          <div class="accordion" id="btFaqAcc">
            <div class="accordion-item">
              <h2 class="accordion-header"><button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#faqCol1" data-i18n="faqQ1"></button></h2>
              <div id="faqCol1" class="accordion-collapse collapse show" data-bs-parent="#btFaqAcc"><div class="accordion-body small" data-i18n="faqA1"></div></div>
            </div>
            <div class="accordion-item">
              <h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#faqCol2" data-i18n="faqQ2"></button></h2>
              <div id="faqCol2" class="accordion-collapse collapse" data-bs-parent="#btFaqAcc"><div class="accordion-body small" data-i18n="faqA2"></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
