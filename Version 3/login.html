  <main id="main" class="bw-auth-shell">
    <div class="container">
      <div class="row g-4 align-items-stretch justify-content-center">
        <!-- Left 3-Slide Visual Showcase -->
        <div class="col-lg-5 d-none d-lg-block">
          <aside class="bw-auth-showcase">
            <div>
              <span class="badge bg-light text-dark rounded-pill px-3 py-2 mb-3 fw-bold">BreatheWell v3 · Family Suite</span>
              <div class="v3-auth-slide">
                <i class="bi bi-lungs-fill display-3 text-info mb-3 d-block"></i>
                <h2 class="h3 fw-bold mb-2" data-i18n="showcase1Title"></h2>
                <p class="opacity-90" data-i18n="showcase1Sub"></p>
              </div>
              <div class="v3-auth-slide d-none">
                <i class="bi bi-heart-pulse-fill display-3 text-warning mb-3 d-block"></i>
                <h2 class="h3 fw-bold mb-2" data-i18n="showcase2Title"></h2>
                <p class="opacity-90" data-i18n="showcase2Sub"></p>
              </div>
              <div class="v3-auth-slide d-none">
                <i class="bi bi-file-earmark-medical-fill display-3 text-light mb-3 d-block"></i>
                <h2 class="h3 fw-bold mb-2" data-i18n="showcase3Title"></h2>
                <p class="opacity-90" data-i18n="showcase3Sub"></p>
              </div>
            </div>
            <div class="small opacity-75 border-top border-light border-opacity-25 pt-3">
              <i class="bi bi-shield-lock-fill me-1"></i> <span data-i18n="footerPrivacyNote"></span>
            </div>
          </aside>
        </div>

        <!-- Right Login Form Card -->
        <div class="col-lg-6 col-xl-5">
          <div class="bw-auth-card h-100">
            <div id="loginFormPanel">
              <h1 class="h4 fw-bold mb-1" data-i18n="authHeading"></h1>
              <p class="small text-muted mb-3" data-i18n="authSubtitle"></p>

              <div id="loginErrorAlert" class="alert alert-danger small d-none" role="alert"></div>

              <form id="loginForm" novalidate>
                <div class="mb-3">
                  <label for="loginEmail" class="form-label fw-semibold small" data-i18n="lblEmail"></label>
                  <input type="email" id="loginEmail" class="form-control" autocomplete="email" data-i18n-placeholder="phEmail" required>
                </div>

                <div class="mb-2">
                  <label for="loginPassword" class="form-label fw-semibold small" data-i18n="lblPassword"></label>
                  <div class="bw-pass-wrap">
                    <input type="password" id="loginPassword" class="form-control" autocomplete="current-password" data-i18n-placeholder="phPassword" required>
                    <button type="button" class="bw-pass-toggle" id="loginPassToggle" aria-label="Toggle password visibility"><i class="bi bi-eye"></i></button>
                  </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3 small">
                  <label class="form-check"><input type="checkbox" id="loginRememberChk" class="form-check-input"> <span data-i18n="lblRemember"></span></label>
                  <button type="button" class="btn btn-link p-0 small text-decoration-none" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal" data-i18n="linkForgot"></button>
                </div>

                <button type="submit" class="btn btn-bw-primary w-100 mb-3" data-i18n="btnLoginSubmit"></button>
              </form>

              <div class="bw-demo-callout mb-3">
                <strong class="d-block small mb-1"><i class="bi bi-people-fill text-success me-1"></i> <span data-i18n="demoBoxTitle"></span></strong>
                <p class="small text-muted mb-2" data-i18n="demoBoxDesc"></p>
                <button type="button" id="loginDemoBtn" class="btn btn-bw-emerald w-100 btn-sm" data-i18n="btnDemoLogin"></button>
              </div>

              <div class="text-center small">
                <span class="text-muted" data-i18n="noAccountText"></span>
                <a href="register.html" class="fw-bold text-decoration-none ms-1" data-i18n="linkRegister"></a>
              </div>
              <div class="text-center mt-2">
                <a href="index.html" class="small text-muted text-decoration-none" data-i18n="linkGuest"></a>
              </div>
            </div>

            <div id="loginActivePanel" class="d-none">
              <h2 class="h4 fw-bold mb-1" data-i18n="signedInHeading"></h2>
              <p class="small text-muted mb-3" data-i18n="signedInSub"></p>
              <div id="loginActiveMembers" class="mb-3"></div>
              <div class="d-grid gap-2">
                <a href="profile.html" class="btn btn-bw-primary" data-i18n="btnGoProfile"></a>
                <div class="row g-2">
                  <div class="col-6"><a href="index.html" class="btn btn-bw-outline w-100" data-i18n="btnGoHome"></a></div>
                  <div class="col-6"><button type="button" id="loginLogoutBtn" class="btn btn-outline-danger w-100" data-i18n="btnLogout"></button></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- 2-Step Forgot Password Modal -->
  <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-labelledby="forgotModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header"><h5 class="modal-title fw-bold" id="forgotModalTitle" data-i18n="forgotTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
        <div class="modal-body">
          <div id="forgotErrMsg" class="alert alert-danger small d-none"></div>
          <div id="forgotStep1Pane">
            <p class="small text-muted mb-3" data-i18n="forgotDesc"></p>
            <input type="email" id="forgotEmailInput" class="form-control mb-3" placeholder="name@example.com">
            <button type="button" id="forgotStep1Btn" class="btn btn-bw-primary w-100" data-i18n="forgotBtnStep1"></button>
          </div>
          <div id="forgotStep2Pane" class="d-none">
            <div class="alert alert-info small"><span data-i18n="forgotOtpHint"></span> <strong id="forgotOtpDisplay" class="tabular-nums fs-5"></strong></div>
            <input type="text" id="forgotCodeInput" class="form-control mb-2 tabular-nums" placeholder="6-digit code">
            <label for="forgotNewPassInput" class="form-label small fw-semibold" data-i18n="forgotNewPassLbl"></label>
            <input type="password" id="forgotNewPassInput" class="form-control mb-3" minlength="6">
            <button type="button" id="forgotStep2Btn" class="btn btn-bw-emerald w-100" data-i18n="forgotBtnStep2"></button>
          </div>
        </div>
      </div>
    </div>
  </div>

        <a href="health-demo.html" class="bw-drawer-link" data-nav-page="health-demo.html"><i class="bi bi-database-fill-gear"></i> <span data-i18n="subTabVitalsDemo"></span></a>
