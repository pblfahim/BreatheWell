  <main id="main" class="container py-4 bw-fade-in">
    <header class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
      <div>
        <h1 class="h3 fw-bold mb-1" data-i18n="heroTitle"></h1>
        <p class="small text-muted mb-0" data-i18n="heroSub"></p>
      </div>
      <div class="bw-segmented">
        <button type="button" class="bw-seg-btn active" data-hr-mode="all" data-i18n="modeAll"></button>
        <button type="button" class="bw-seg-btn" data-hr-mode="bp" data-i18n="modeBp"></button>
        <button type="button" class="bw-seg-btn" data-hr-mode="bg" data-i18n="modeBg"></button>
      </div>
    </header>

    <div id="crisisAlertBanner" class="bw-crisis-box text-danger fw-bold small mb-4 d-none" role="alert" data-i18n="crisisBanner"></div>

    <div class="row g-4 mb-4">
      <!-- Column 1: BP Analyzer -->
      <div id="colBPForm" class="col-lg-6">
        <section class="bw-card p-3 p-md-4 h-100">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 fw-bold mb-0"><i class="bi bi-heart-pulse-fill text-danger me-1"></i> <span data-i18n="bpTitle"></span></h2>
            <span id="bpLiveBadge" class="bw-status-pill bw-status-normal">—</span>
          </div>

          <div class="bp-track" aria-hidden="true"><div id="bpLiveNeedle" class="bw-gauge-needle"></div></div>
          <div class="d-flex flex-wrap gap-1 mb-3">
            <button type="button" class="ht-preset-chip" data-bp-preset="85/55">Low 85/55</button>
            <button type="button" class="ht-preset-chip" data-bp-preset="115/75">Optimal 115/75</button>
            <button type="button" class="ht-preset-chip" data-bp-preset="124/82">Elevated 124/82</button>
            <button type="button" class="ht-preset-chip" data-bp-preset="135/86">Stage 1 135/86</button>
            <button type="button" class="ht-preset-chip" data-bp-preset="148/95">Stage 2 148/95</button>
          </div>
          <div id="bpBenchmarkNote" class="alert alert-info py-2 px-3 small mb-3"></div>

          <form id="bpForm">
            <div class="row g-3">
              <div class="col-4"><label for="bpAgeInput" class="form-label small fw-semibold" data-i18n="lblAge"></label><input type="number" id="bpAgeInput" class="form-control tabular-nums" value="32" min="1" max="120"></div>
              <div class="col-4"><label for="bpSysInput" class="form-label small fw-semibold" data-i18n="lblSys"></label><input type="number" id="bpSysInput" class="form-control tabular-nums" value="116" min="40" max="300" required></div>
              <div class="col-4"><label for="bpDiaInput" class="form-label small fw-semibold" data-i18n="lblDia"></label><input type="number" id="bpDiaInput" class="form-control tabular-nums" value="74" min="20" max="200" required></div>
              <div class="col-6"><label for="bpPulseInput" class="form-label small fw-semibold" data-i18n="lblPulse"></label><input type="number" id="bpPulseInput" class="form-control tabular-nums" value="70" min="25" max="240"></div>
              <div class="col-6"><label for="bpArmSelect" class="form-label small fw-semibold" data-i18n="lblArm"></label><select id="bpArmSelect" class="form-select"><option value="left">Left Arm</option><option value="right">Right Arm</option></select></div>
              <div class="col-12"><label for="bpNoteInput" class="form-label small fw-semibold" data-i18n="lblNote"></label><input type="text" id="bpNoteInput" class="form-control"></div>
            </div>
            <button type="submit" class="btn btn-bw-primary w-100 mt-3" data-i18n="btnSaveBp"></button>
          </form>
        </section>
      </div>

      <!-- Column 2: Glucose Analyzer -->
      <div id="colBGForm" class="col-lg-6">
        <section class="bw-card p-3 p-md-4 h-100">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 fw-bold mb-0"><i class="bi bi-droplet-fill text-warning me-1"></i> <span data-i18n="glTitle"></span></h2>
            <span id="glLiveBadge" class="bw-status-pill bw-status-normal">—</span>
          </div>

          <div class="bg-track" aria-hidden="true"><div id="glLiveNeedle" class="bw-gauge-needle"></div></div>
          <div class="d-flex flex-wrap gap-1 mb-3">
            <button type="button" class="ht-preset-chip" data-bg-preset="3.6">Hypo 3.6</button>
            <button type="button" class="ht-preset-chip" data-bg-preset="5.2">Normal 5.2</button>
            <button type="button" class="ht-preset-chip" data-bg-preset="6.4">Prediabetes 6.4</button>
            <button type="button" class="ht-preset-chip" data-bg-preset="8.5">Diabetes 8.5</button>
          </div>

          <form id="glForm">
            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="glValInput" class="form-label small fw-semibold mb-0" data-i18n="lblGlVal"></label>
                <div class="bw-segmented">
                  <button type="button" class="bw-seg-btn active" data-gl-unit="mmol">mmol/L</button>
                  <button type="button" class="bw-seg-btn" data-gl-unit="mgdl">mg/dL</button>
                </div>
              </div>
              <input type="number" step="0.1" id="glValInput" class="form-control tabular-nums" value="5.2" required>
              <small id="glConvHint" class="text-muted tabular-nums"></small>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-4"><button type="button" class="ht-timing-card w-100 active" data-gl-timing="fasting">Fasting (8h+)</button></div>
              <div class="col-4"><button type="button" class="ht-timing-card w-100" data-gl-timing="postmeal">2h Post-Meal</button></div>
              <div class="col-4"><button type="button" class="ht-timing-card w-100" data-gl-timing="random">Random</button></div>
            </div>

            <div class="mb-3">
              <label for="glNoteInput" class="form-label small fw-semibold" data-i18n="lblNote"></label>
              <input type="text" id="glNoteInput" class="form-control">
            </div>

            <button type="submit" class="btn btn-bw-primary w-100" data-i18n="btnSaveGl"></button>
          </form>
        </section>
      </div>
    </div>

    <!-- Live WhatsApp Clinical Summary Card -->
    <section class="bw-card p-3 p-md-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
        <h2 class="h6 fw-bold mb-0"><i class="bi bi-whatsapp text-success me-1"></i> <span data-i18n="waCardTitle"></span></h2>
        <div class="d-flex gap-2">
          <button type="button" id="btnCopyWA" class="btn btn-sm btn-bw-outline" data-i18n="commonCopy"></button>
          <button type="button" id="btnSendWA" class="btn btn-sm btn-success" data-i18n="btnWaSend"></button>
        </div>
      </div>
      <textarea id="waPreviewText" class="form-control small tabular-nums" rows="4" readonly></textarea>
    </section>
