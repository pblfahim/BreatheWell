  <div id="bwContextStrip" class="bw-context-strip no-print"></div>

  <main id="main" class="container py-4 bw-fade-in">
    <!-- ======== SCREEN 1: PROTOCOL LIBRARY & RECENT MEMBER SESSIONS ======== -->
    <section id="exLibraryScreen" class="ex-screen active">
      <header class="ex-studio-hero mb-4">
        <div class="row align-items-center g-3">
          <div class="col-lg-8">
            <h1 class="h3 fw-bold mb-1" data-i18n="heroTitle"></h1>
            <p class="small opacity-90 mb-0" data-i18n="heroSub"></p>
          </div>
          <div class="col-lg-4 d-flex gap-3 justify-content-lg-end">
            <div class="text-center"><small class="opacity-75 d-block">Streak</small><strong id="exLibStreakStat" class="fs-4 tabular-nums">0d</strong></div>
            <div class="text-center"><small class="opacity-75 d-block">Total</small><strong id="exLibMinsStat" class="fs-4 tabular-nums">0m</strong></div>
          </div>
        </div>
      </header>

      <div class="bw-card p-3 mb-4 d-flex flex-wrap align-items-center justify-content-between gap-2">
        <div class="bw-segmented">
          <button type="button" class="bw-seg-btn active" data-ex-goal="all">All</button>
          <button type="button" class="bw-seg-btn" data-ex-goal="stress">Stress</button>
          <button type="button" class="bw-seg-btn" data-ex-goal="focus">Focus</button>
          <button type="button" class="bw-seg-btn" data-ex-goal="sleep">Sleep</button>
          <button type="button" class="bw-seg-btn" data-ex-goal="mindful">Mindful</button>
        </div>
        <div class="bw-segmented">
          <button type="button" class="bw-seg-btn active" data-soundscape="chimes">Chimes</button>
          <button type="button" class="bw-seg-btn" data-soundscape="rain">Rain</button>
          <button type="button" class="bw-seg-btn" data-soundscape="drone">Drone</button>
          <button type="button" class="bw-seg-btn" data-soundscape="off">Silent</button>
        </div>
      </div>

      <div class="row g-3 mb-5" id="exLibraryCards"></div>

      <div class="bw-card p-3 p-md-4">
        <h2 class="h5 fw-bold mb-3" data-i18n="recentTitle"></h2>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead><tr><th>Date</th><th>Protocol</th><th>Duration</th><th>Cycles</th><th>Mood</th></tr></thead>
            <tbody id="exHistoryBody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- ======== SCREEN 2: DETAIL CONFIGURATION & WAVEFORM PREVIEW ======== -->
    <section id="exDetailScreen" class="ex-screen">
      <button type="button" id="detailBackBtn" class="btn btn-bw-outline mb-3"><i class="bi bi-arrow-left"></i> <span data-i18n="btnBackLibrary"></span></button>
      <div class="bw-card p-4">
        <h2 id="detailExTitle" class="h4 fw-bold mb-1">Protocol</h2>
        <p id="detailExDesc" class="small text-muted mb-3"></p>
        <div class="ex-waveform-wrap mb-3">
          <svg id="detailWaveformSvg" viewBox="0 0 420 90" class="w-100 h-auto" aria-hidden="true"></svg>
          <div id="detailPatternTxt" class="small text-info text-center fw-semibold mt-1"></div>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <span class="small fw-bold d-block mb-1">Difficulty Level</span>
            <div class="bw-segmented w-100">
              <button type="button" class="bw-seg-btn flex-fill" data-detail-lv="1">L1</button>
              <button type="button" class="bw-seg-btn flex-fill active" data-detail-lv="2">L2</button>
              <button type="button" class="bw-seg-btn flex-fill" data-detail-lv="3">L3</button>
            </div>
          </div>
          <div class="col-md-6">
            <span class="small fw-bold d-block mb-1">Session Length</span>
            <div class="bw-segmented w-100">
              <button type="button" class="bw-seg-btn flex-fill" data-detail-dur="1">1m</button>
              <button type="button" class="bw-seg-btn flex-fill active" data-detail-dur="2">2m</button>
              <button type="button" class="bw-seg-btn flex-fill" data-detail-dur="5">5m</button>
              <button type="button" class="bw-seg-btn flex-fill" data-detail-dur="10">10m</button>
            </div>
          </div>
        </div>
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 pt-3 border-top">
          <label class="form-check form-switch small fw-semibold"><input type="checkbox" id="detailTtsChk" class="form-check-input"> Voice Coach (TTS)</label>
          <button type="button" id="detailStartBtn" class="btn btn-bw-primary px-4"><i class="bi bi-play-fill"></i> <span data-i18n="btnStartSession"></span></button>
        </div>
      </div>
    </section>

    <!-- ======== SCREEN 3: IMMERSIVE ACTIVE SESSION STAGE ======== -->
    <section id="exSessionScreen" class="ex-screen">
      <div class="ex-session-stage ex-narrow-stage text-center mx-auto">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <span class="badge bg-light text-dark rounded-pill px-3 py-2">Cycles: <strong id="sessionCycleStat" class="tabular-nums">0</strong></span>
          <span id="sessionRemStat" class="fs-5 fw-bold tabular-nums">2:00</span>
        </div>

        <div class="ex-mandala-stage my-3">
          <svg class="ex-ring-svg" viewBox="0 0 280 280" aria-hidden="true">
            <circle cx="140" cy="140" r="124" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="8"></circle>
            <circle id="sessionRingCircle" cx="140" cy="140" r="124" fill="none" stroke="#6ee7b7" stroke-width="8" stroke-linecap="round"></circle>
          </svg>
          <div id="sessionLotusHalo" class="ex-lotus-halo"></div>
          <div id="sessionBreathCore" class="ex-breath-core">
            <span id="sessionCueText" class="fw-bold small px-2" aria-live="polite">Inhale</span>
            <span id="sessionPhaseSec" class="fs-2 fw-bold tabular-nums">4s</span>
          </div>
        </div>

        <div class="ex-audio-bars my-3" aria-hidden="true">
          <span class="ex-audio-bar"></span><span class="ex-audio-bar"></span><span class="ex-audio-bar"></span>
          <span class="ex-audio-bar"></span><span class="ex-audio-bar"></span><span class="ex-audio-bar"></span><span class="ex-audio-bar"></span>
        </div>

        <div class="d-flex justify-content-center gap-2 mt-3">
          <button type="button" id="sessionPauseBtn" class="btn btn-light fw-bold px-4" data-i18n="btnPause"></button>
          <button type="button" id="sessionFinishBtn" class="btn btn-outline-light px-4" data-i18n="btnExit"></button>
        </div>
      </div>
    </section>

    <!-- ======== SCREEN 4: COMPLETION TROPHY, CONFETTI & MOOD LOGGING ======== -->
    <section id="exCompleteScreen" class="ex-screen text-center">
      <div class="bw-card ex-complete-card p-4 p-md-5 mx-auto">
        <button type="button" id="completeTrophyBtn" class="ex-trophy-btn mx-auto mb-3" aria-label="Replay celebration trophy"><i class="bi bi-trophy-fill"></i></button>
        <h2 class="h3 fw-bold mb-2" data-i18n="completeTitle"></h2>
        <p class="small text-muted mb-4" data-i18n="completeSub"></p>
        <div class="d-flex flex-wrap justify-content-center gap-2 mb-4">
          <button type="button" class="ex-mood-pill active" data-mood="calm">Calm</button>
          <button type="button" class="ex-mood-pill" data-mood="focused">Focused</button>
          <button type="button" class="ex-mood-pill" data-mood="refreshed">Refreshed</button>
          <button type="button" class="ex-mood-pill" data-mood="sleepy">Sleepy</button>
        </div>
        <div class="d-flex flex-wrap justify-content-center gap-2">
          <button type="button" id="completeSaveBtn" class="btn btn-bw-primary px-4" data-i18n="btnSaveMoodSession"></button>
          <button type="button" id="completeShareWaBtn" class="btn btn-success"><i class="bi bi-whatsapp"></i> Share</button>
          <a href="breath-test.html" class="btn btn-bw-outline" data-i18n="btnGoBolt"></a>
        </div>
      </div>
    </section>
  </main>
