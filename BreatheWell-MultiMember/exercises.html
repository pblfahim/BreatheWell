  <!-- ======== MAIN BREATHING SANCTUARY ======== -->
  <main id="main" class="container py-4 bw-fade-in">
    <header class="mb-4">
      <h1 class="h3 fw-bold mb-1" data-i18n="heroTitle"></h1>
      <p class="small text-muted mb-0" data-i18n="heroSub"></p>
    </header>

    <div class="row g-4 mb-5">
      <!-- Protocol & Level Controls Column -->
      <div class="col-lg-5">
        <div class="bw-card p-3 p-md-4 h-100">
          <h2 class="h6 fw-bold text-uppercase text-muted mb-3" data-i18n="secSelectProtocol"></h2>
          <div class="d-grid gap-2 mb-4">
            <button type="button" class="bw-protocol-card active" data-protocol="box">
              <strong class="d-block" data-i18n="pBoxTitle"></strong>
              <small class="text-muted" data-i18n="pBoxRatio"></small>
            </button>
            <button type="button" class="bw-protocol-card" data-protocol="478">
              <strong class="d-block" data-i18n="p478Title"></strong>
              <small class="text-muted" data-i18n="p478Ratio"></small>
            </button>
            <button type="button" class="bw-protocol-card" data-protocol="pranayama">
              <strong class="d-block" data-i18n="pPranaTitle"></strong>
              <small class="text-muted" data-i18n="pPranaRatio"></small>
            </button>
            <button type="button" class="bw-protocol-card" data-protocol="diaphragmatic">
              <strong class="d-block" data-i18n="pDiaTitle"></strong>
              <small class="text-muted" data-i18n="pDiaRatio"></small>
            </button>
          </div>

          <div class="mb-3">
            <span class="small fw-semibold d-block mb-1" data-i18n="lblLevel"></span>
            <div class="bw-segmented w-100">
              <button type="button" class="bw-seg-btn flex-fill active" data-ex-level="1">L1 (1.0x)</button>
              <button type="button" class="bw-seg-btn flex-fill" data-ex-level="2">L2 (1.25x)</button>
              <button type="button" class="bw-seg-btn flex-fill" data-ex-level="3">L3 (1.5x)</button>
            </div>
          </div>

          <div class="mb-3">
            <span class="small fw-semibold d-block mb-1" data-i18n="lblDuration"></span>
            <div class="bw-segmented w-100">
              <button type="button" class="bw-seg-btn flex-fill active" data-ex-dur="2">2 min</button>
              <button type="button" class="bw-seg-btn flex-fill" data-ex-dur="5">5 min</button>
              <button type="button" class="bw-seg-btn flex-fill" data-ex-dur="10">10 min</button>
            </div>
          </div>

          <div class="d-flex flex-wrap gap-3 pt-2 border-top">
            <label class="form-check form-switch small fw-semibold">
              <input class="form-check-input" type="checkbox" id="exAudioToggle" checked>
              <span data-i18n="optAudio"></span>
            </label>
            <label class="form-check form-switch small fw-semibold">
              <input class="form-check-input" type="checkbox" id="exTtsToggle">
              <span data-i18n="optTts"></span>
            </label>
          </div>
        </div>
      </div>

      <!-- Graphical Synchronized Sanctum Stage -->
      <div class="col-lg-7">
        <div class="bw-sanctum-stage text-center h-100 d-flex flex-column justify-content-between">
          <div>
            <div class="bw-mandala-wrap mb-3">
              <svg class="bw-mandala-ring-svg" viewBox="0 0 248 248" aria-hidden="true">
                <circle cx="124" cy="124" r="108" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="8"></circle>
                <circle id="exProgressCircle" cx="124" cy="124" r="108" fill="none" stroke="#6ee7b7" stroke-width="8" stroke-linecap="round"></circle>
              </svg>
              <div id="exMandalaPetal" class="bw-mandala-petal"></div>
              <div id="exMandalaCore" class="bw-mandala-core">
                <span id="exCueText" class="fw-bold small px-2" aria-live="polite">Ready</span>
                <span id="exPhaseCount" class="fs-2 fw-bold tabular-nums">0s</span>
              </div>
            </div>

            <div class="bw-waveform-box mb-3">
              <svg id="exWaveformSvg" viewBox="0 0 400 74" class="w-100 h-auto" aria-hidden="true"></svg>
            </div>
          </div>

          <div>
            <div class="d-flex justify-content-center flex-wrap gap-2 mb-3">
              <button type="button" id="exMainActionBtn" class="btn btn-light fw-bold px-4"></button>
              <button type="button" id="exResetBtn" class="btn btn-outline-light px-3" data-i18n="btnReset"></button>
            </div>

            <div class="row g-2 text-center">
              <div class="col-3"><div class="small opacity-75" data-i18n="statCycles"></div><strong id="exCyclesStat" class="tabular-nums fs-5">0</strong></div>
              <div class="col-3"><div class="small opacity-75" data-i18n="statRemaining"></div><strong id="exRemainingStat" class="tabular-nums fs-5">2:00</strong></div>
              <div class="col-3"><div class="small opacity-75" data-i18n="statStreak"></div><strong id="exStreakStat" class="tabular-nums fs-5">0</strong></div>
              <div class="col-3"><div class="small opacity-75" data-i18n="statTotalMin"></div><strong id="exTotalMinStat" class="tabular-nums fs-5">0</strong></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Active Member Session History -->
    <section class="bw-card p-3 p-md-4">
      <h2 class="h5 fw-bold mb-3" data-i18n="recentTitle"></h2>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead><tr><th>Date</th><th>Protocol</th><th>Duration</th><th>Cycles</th><th>Mood</th></tr></thead>
          <tbody id="exHistoryBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- ======== POST-SESSION MOOD COMPLETION MODAL ======== -->
  <div class="modal fade" id="exCompleteModal" tabindex="-1" aria-labelledby="exModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold" id="exModalTitle" data-i18n="moodModalTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="small text-muted mb-3" data-i18n="moodModalSub"></p>
          <div class="d-flex flex-wrap gap-2">
            <button type="button" class="bw-mood-btn active" data-mood="calm" data-i18n="moodCalm"></button>
            <button type="button" class="bw-mood-btn" data-mood="focused" data-i18n="moodFocused"></button>
            <button type="button" class="bw-mood-btn" data-mood="sleepy" data-i18n="moodSleepy"></button>
            <button type="button" class="bw-mood-btn" data-mood="energized" data-i18n="moodEnergized"></button>
          </div>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" data-i18n="commonCancel"></button>
          <button type="button" id="exSaveModalBtn" class="btn btn-bw-primary" data-i18n="btnSaveSession"></button>
        </div>
      </div>
    </div>
  </div>
