  <!-- ======== MAIN AUTHENTICATION SHELL ======== -->
  <main id="main" class="bw-auth-shell">
    <div class="bw-auth-card bw-fade-in">
      <!-- Sign-In Form View (Guests) -->
      <div id="loginFormPanel">
        <div class="text-center mb-4">
          <div class="bw-auth-emblem mx-auto mb-3">
            <i class="bi bi-shield-lock-fill" aria-hidden="true"></i>
          </div>
          <h1 class="h4 fw-bold mb-1" data-i18n="authHeading">পরিবার অ্যাকাউন্টে প্রবেশ করুন</h1>
          <p class="small text-muted mb-0" data-i18n="authSubtitle"></p>
        </div>

        <div id="loginErrorAlert" class="alert alert-danger small d-none" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="loginEmail" class="form-label fw-semibold small" data-i18n="lblEmail">ইমেইল ঠিকানা</label>
            <input type="email" id="loginEmail" class="form-control" autocomplete="email" data-i18n-placeholder="phEmail" required>
          </div>

          <div class="mb-3">
            <label for="loginPassword" class="form-label fw-semibold small" data-i18n="lblPassword">পাসওয়ার্ড</label>
            <div class="bw-pass-wrap">
              <input type="password" id="loginPassword" class="form-control" autocomplete="current-password" data-i18n-placeholder="phPassword" required>
              <button type="button" class="bw-pass-toggle" id="loginPassToggle" aria-label="Toggle password visibility">
                <i class="bi bi-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-bw-primary w-100 mb-3" data-i18n="btnLoginSubmit">লগইন করুন</button>
        </form>

        <div class="text-center text-muted small my-3" data-i18n="orDivider">অথবা</div>

        <!-- 1-Click 4-Member Family Demo Unlock Box -->
        <div class="bw-demo-callout mb-3">
          <div class="d-flex align-items-start gap-2 mb-2">
            <i class="bi bi-people-fill text-success fs-5" aria-hidden="true"></i>
            <div>
              <strong class="d-block small" data-i18n="demoBoxTitle"></strong>
              <span class="small text-muted" data-i18n="demoBoxDesc"></span>
            </div>
          </div>
          <button type="button" id="loginDemoBtn" class="btn btn-bw-outline w-100" data-i18n="btnDemoLogin"></button>
        </div>

        <div class="text-center small">
          <span class="text-muted" data-i18n="noAccountText"></span>
          <a href="register.html" class="fw-bold text-decoration-none ms-1" data-i18n="linkRegister">নিবন্ধন করুন</a>
        </div>
        <div class="text-center mt-2">
          <a href="index.html" class="small text-muted text-decoration-none" data-i18n="linkGuest"></a>
        </div>
      </div>

      <!-- Already Signed-In Quick Household Switch View -->
      <div id="loginActivePanel" class="d-none">
        <div class="text-center mb-3">
          <div class="bw-auth-emblem mx-auto mb-3"><i class="bi bi-check2-circle" aria-hidden="true"></i></div>
          <h2 class="h4 fw-bold mb-1" data-i18n="signedInHeading"></h2>
          <p class="small text-muted" data-i18n="signedInSub"></p>
        </div>
        <div id="loginActiveMembers" class="mb-3"></div>
        <div class="d-grid gap-2">
          <a href="profile.html" class="btn btn-bw-primary" data-i18n="btnGoProfile"></a>
          <div class="row g-2">
            <div class="col-6"><a href="index.html" class="btn btn-bw-outline w-100" data-i18n="btnGoHome"></a></div>
            <div class="col-6"><button type="button" id="loginLogoutBtn" class="btn btn-outline-danger w-100" data-i18n="btnLogout"></button></div>
          </div>
        </div>
      </div>
